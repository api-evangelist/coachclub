  detail: >-
    CoachClub ships a consumer fitness-video subscription and nothing else — the member
    application at mon.coachclub.com is a hosted Kajabi tenant (CNAME endpoint.mykajabi.com)
    that 404s every spec and .well-known path, and the only host named api.coachclub.com is
    a bare nginx catch-all on EC2 that answers 200 with a zero-byte body for every path,
    including a nonsense control path, so it serves no contract at all.
